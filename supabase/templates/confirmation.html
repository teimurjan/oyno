<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Your Oyno code</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#fff8ef;">
<!-- Preview text. The notification banner carries the code, so it can be typed without leaving the screen that asked. -->
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ .Token }} is your Oyno code.</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fff8ef" style="background-color:#fff8ef;background-image:linear-gradient(180deg,#a2c8ef 0%,#d3e6f8 34%,#fff1db 64%,#fff8ef 100%);">
  <tr>
    <td align="center" style="padding:40px 16px 48px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 4px 20px;">
            <img src="{{ .SiteURL }}/ico/wordmark.png" width="72" height="30" alt="oyno" style="display:block;border:0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#18202e;">
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;background:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.95);border-radius:22px;box-shadow:0 10px 30px rgba(48,80,130,0.12);padding:28px 24px;">
            <p style="margin:0 0 8px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;line-height:18px;color:#7d8696;">Sign-in code</p>
            <p style="margin:0 0 16px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:40px;font-weight:700;letter-spacing:0.12em;line-height:1.2;font-variant-numeric:tabular-nums;color:#18202e;">{{ .Token }}</p>
            <p style="margin:0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#4e5869;">Enter it on the screen where you asked for it. It expires in an hour.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#7d8696;">Didn’t ask for a code? Ignore this email — nothing happens without it.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
