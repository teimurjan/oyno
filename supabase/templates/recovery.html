<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Reset your Oyno password</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#fff8ef;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Choose a new password for {{ .Email }}.</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fff8ef" style="background-color:#fff8ef;background-image:linear-gradient(180deg,#a2c8ef 0%,#d3e6f8 34%,#fff1db 64%,#fff8ef 100%);">
  <tr>
    <td align="center" style="padding:40px 16px 48px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:440px;">
        <tr>
          <td style="padding:0 4px 20px;">
            <img src="{{ .SiteURL }}/ico/wordmark.png" width="72" height="30" alt="oyno" style="display:block;border:0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;font-weight:700;color:#18202e;">
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;background:rgba(255,255,255,0.72);border:1px solid rgba(255,255,255,0.95);border-radius:22px;box-shadow:0 10px 30px rgba(48,80,130,0.12);padding:28px 24px;">
            <p style="margin:0 0 8px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;line-height:18px;color:#7d8696;">Password reset</p>
            <p style="margin:0 0 24px;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#4e5869;">Tap the button to choose a new password for <span style="color:#18202e;font-weight:600;">{{ .Email }}</span>. The link works once and expires in an hour.</p>
            <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery" style="display:block;padding:15px 24px;border-radius:999px;background:#18202e;color:#ffffff;text-decoration:none;text-align:center;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;font-weight:600;line-height:22px;">Choose a new password</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 4px 0;font-family:Figtree,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#7d8696;">Didn’t ask to reset it? Ignore this email — your password stays as it is.</td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
